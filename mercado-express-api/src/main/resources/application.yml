server:
  port: 8080

spring:
  application:
    name: mercado-express-api
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: 5672
    username: guest
    password: guest
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/mercado}
    username: ${DB_USER:mercado}
    password: ${DB_PASSWORD:mercado123}
  jpa:
    hibernate:
      ddl-auto: update
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

mercado:
  email-remetente: "Mercado Express <nao-responda@mercadoexpress.com.br>"
